{% extends "base.html" %}

{% block title %}Pongal Collection{% endblock %}
{% block page_name %}New Collection{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="card-title mb-0 fw-bold">
                    <i class="bi bi-cash-coin me-2"></i>New Pongal Collection
                </h4>
            </div>
            <div class="card-body p-4">
                <form id="collectionForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="person_name" class="form-label fw-semibold">Person Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="person_name" placeholder="Enter person name" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="mobile_number" class="form-label fw-semibold">Mobile Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control" id="mobile_number" placeholder="Enter 10-digit mobile" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="amount" class="form-label fw-semibold">Amount (₹) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-currency-rupee"></i></span>
                                <input type="number" step="0.01" class="form-control" id="amount" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="collection_date" class="form-label fw-semibold">Collection Date <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
                                <input type="date" class="form-control" id="collection_date" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="payment_mode" class="form-label fw-semibold">Payment Mode <span class="text-danger">*</span></label>
                            <select class="form-select" id="payment_mode" required>
                                <option value="">Select Payment Mode</option>
                                <option value="CASH">Cash</option>
                                <option value="UPI">UPI</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="payment_status" class="form-label fw-semibold">Payment Status <span class="text-danger">*</span></label>
                            <select class="form-select" id="payment_status" required>
                                <option value="">Select Payment Status</option>
                                <option value="PAID">Paid</option>
                                <option value="UNPAID">Unpaid</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="collector_name" class="form-label fw-semibold">Collector Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control" id="collector_name" placeholder="Enter collector name" required>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i> Submit Collection
                            </button>
                        </div>
                    </div>
                </form>

                <div id="result" class="mt-4"></div>
                <div id="share" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Default date to today
document.getElementById('collection_date').valueAsDate = new Date();

let lastSubmittedData = null;

document.getElementById('collectionForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const resultDiv = document.getElementById('result');
    const shareDiv = document.getElementById('share');

    resultDiv.innerHTML = '<div class="alert alert-info py-2"><i class="bi bi-hourglass-split me-1"></i> Submitting...</div>';
    shareDiv.innerHTML = '';

    const payload = {
        person_name: document.getElementById('person_name').value.trim(),
        mobile_number: document.getElementById('mobile_number').value.trim(),
        amount: document.getElementById('amount').value,
        collection_date: document.getElementById('collection_date').value,
        payment_mode: document.getElementById('payment_mode').value,
        payment_status: document.getElementById('payment_status').value,
        collector_name: document.getElementById('collector_name').value.trim()
    };

    try {
        const response = await fetch('/api/collections/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (response.ok) {
            lastSubmittedData = {
                ...payload,
                token: data.token || 'N/A'
            };

            resultDiv.innerHTML = `
                <div class="alert alert-success d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill fs-4 me-2"></i>
                    <div>
                        <strong>Collection recorded successfully!</strong><br>
                        Token: <span class="badge bg-success fs-6">${lastSubmittedData.token}</span>
                    </div>
                </div>
            `;

            shareDiv.innerHTML = `
                <div class="card border p-3 bg-light">
                    <h6 class="fw-bold mb-2">Actions</h6>
                    <div class="d-flex gap-2 flex-wrap">
                        <button id="printBtn" class="btn btn-outline-secondary">
                            <i class="bi bi-printer me-1"></i> Print Receipt
                        </button>
                        <button id="shareBtn" class="btn btn-outline-primary">
                            <i class="bi bi-share me-1"></i> Share
                        </button>
                    </div>
                    <div id="shareOptions" class="mt-3" style="display: none;">
                        <button id="whatsappBtn" class="btn btn-success me-2">
                            <i class="bi bi-whatsapp me-1"></i> WhatsApp
                        </button>
                        <button id="emailBtn" class="btn btn-danger">
                            <i class="bi bi-envelope me-1"></i> Email
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('shareBtn').addEventListener('click', function () {
                document.getElementById('shareOptions').style.display = 'block';
            });

            document.getElementById('printBtn').addEventListener('click', function () {
                window.print();
            });

            document.getElementById('whatsappBtn').addEventListener('click', function () {
                if (!lastSubmittedData) return;
                const message = `*Pongal Collection Acknowledgement*\n\n` +
                    `*Name:* ${lastSubmittedData.person_name}\n` +
                    `*Amount:* Rs.${lastSubmittedData.amount}\n` +
                    `*Payment Mode:* ${lastSubmittedData.payment_mode}\n` +
                    `*Date:* ${lastSubmittedData.collection_date}\n` +
                    `*Token:* ${lastSubmittedData.token}\n\n` +
                    `Thank you for your contribution!`;

                const url = "https://wa.me/?text=" + encodeURIComponent(message);
                window.open(url, "_blank");
            });

            document.getElementById('emailBtn').addEventListener('click', function () {
                if (!lastSubmittedData) return;
                const subject = encodeURIComponent("Pongal Collection Acknowledgement");
                const body = encodeURIComponent(
                    `Pongal Collection Acknowledgement\n\n` +
                    `Name: ${lastSubmittedData.person_name}\n` +
                    `Amount: Rs.${lastSubmittedData.amount}\n` +
                    `Payment Mode: ${lastSubmittedData.payment_mode}\n` +
                    `Date: ${lastSubmittedData.collection_date}\n` +
                    `Token: ${lastSubmittedData.token}\n`
                );
                window.location.href = `mailto:?subject=${subject}&body=${body}`;
            });

            document.getElementById('collectionForm').reset();
            document.getElementById('collection_date').valueAsDate = new Date();
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${JSON.stringify(data)}</div>`;
        }
    } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">Network Error: ${err.message}</div>`;
    }
});
</script>
{% endblock %}
