{% extends "base.html" %}
{% load static %}


{% block title %}Pongal Collection{% endblock %}
{% block page_name %}User List{% endblock %}

{% block content %}

<div x-data="collectionTable()">
<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Person Name</th>
            <th>Email</th>
            <th>Active status</th>
        </tr>
    </thead>

    <tbody>
        <template x-for="item in collections" :key="item.id">
            <tr>
                <td x-text="item.id"></td>
                <td x-text="item.username"></td>
                <td x-text="item.email"></td>
                <td x-text="item.is_active"></td>
            </tr>
        </template>

        <tr x-show="collections.length === 0">
            <td colspan="5" class="text-center">No records found</td>
        </tr>
    </tbody>
</table>
</div>


   
<script>
function collectionTable() {
    return {
        collections: [],
        async init() {
            try {
                const data = await apiFetch("/users/");
                this.collections = Array.isArray(data)
                    ? data
                    : (data.results || []);
            } catch (error) {
                console.error("Failed to load collections:", error);
            }
        }
    };
}
   
</script>
{% endblock %}
